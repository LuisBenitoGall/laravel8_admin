version: '3'
services:
  app:
    build:
      context: ./
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - '${APP_PORT}:9000'
    environment:
      DB_PORT: ${DB_PORT}
    depends_on:
      - laraveldatabase8

  laravel-web:
    build:
      context: ./
      dockerfile: app.web.dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - ${APP_PORT_NGINX}:80
    depends_on:
      - laraveldatabase8

  laraveldatabase8:
    image: mysql:8
    volumes:
      - ./dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - ${DB_PORT_EXT}:${DB_PORT}
