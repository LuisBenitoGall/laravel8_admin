swagger: "2.0"
info:
  title: "ADN - ERP"
  description: "We Are ADN"
  version: 1.0.0
host: admin.weareadn.com
schemes:
  - https
paths:
  /api/v1/login:
    post:
      parameters:
        - in: formData
          name: email
          type: string
          required: true
        - in: formData
          name: password
          type: string
          required: true
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrayOfUsers'
            application/xml:
              schema:
                $ref: '#/components/schemas/ArrayOfUsers'
            text/plain:
              schema:
                type: string

